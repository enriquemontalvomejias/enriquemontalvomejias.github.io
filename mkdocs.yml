site_name: Enrique Montalvo
site_url: https://enriquemontalvomejias.github.io/portfolio/
site_description: Sistemas, infraestructura y seguridad
theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: blue grey
      accent: light blue
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/enrique-montalvo-mejias/
    - icon: fontawesome/brands/github
      link: https://github.com/enriquemontalvomejias
nav:
  - Inicio: index.md
  - Proyectos:
      - Inventario de activos con GLPI: proyectos/glpi.md
      - SIEM distribuido con Wazuh: proyectos/wazuh.md
      - Lab de Active Directory: proyectos/lab-ad.md
