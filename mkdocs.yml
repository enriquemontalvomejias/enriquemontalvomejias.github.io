site_name: Enrique Montalvo
site_url: https://enriquemontalvomejias.github.io/
site_description: Sistemas, infraestructura y ciberseguridad
theme:
  name: material
  custom_dir: overrides
  language: es
  # Las fuentes (IBM Plex) van alojadas en la propia web: docs/assets/fonts
  font: false
  icon:
    logo: material/shield-lock-outline
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - content.code.copy
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/portfolio.js
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/enrique-montalvo-mejias/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/enriquemontalvomejias
      name: GitHub
# Para añadir un proyecto: crea su .md en docs/proyectos/ con el bloque
# "proyecto:" en el front matter y añádelo aquí. Sale solo en la portada,
# con sus filtros, y en la terminal.
nav:
  - Inicio: index.md
  - Proyectos:
      - Inventario de activos con GLPI: proyectos/glpi.md
      - Lab de identidad híbrida: proyectos/lab-ad.md
      - SIEM distribuido con Wazuh: proyectos/wazuh.md
      - MetroASIR (TFG): proyectos/metroasir.md
  - Trayectoria: trayectoria.md
  - Formación: formacion.md
  - Rumbo: rumbo.md
