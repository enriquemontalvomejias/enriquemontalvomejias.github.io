site_name: Enrique Montalvo
site_url: https://enriquemontalvomejias.github.io/
site_description: Sistemas, infraestructura y ciberseguridad
theme:
  name: material
  custom_dir: overrides
  language: es
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/shield-lock-outline
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index:
