{% extends "base.html" %}

{% block extrahead %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Enrique Montalvo">
  <meta property="og:title" content="{% if page.is_homepage %}Enrique Montalvo Mejías · Sistemas y ciberseguridad{% else %}{{ page.title }} · Enrique Montalvo{% endif %}">
  <meta property="og:description" content="Writeups de proyectos reales y laboratorios: arquitectura, decisiones y lo que se rompió por el camino.">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
{% endblock %}
